<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos Oficiales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121b22;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e2a34;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2a3c4d;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .status-badge {
            background-color: #2e7d32;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .info-row {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .label {
            color: #849eaf;
            font-size: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .value {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>SISTEMA DE VERIFICACIÓN</h2>
    </div>
    
    <div class="status-badge">
        DOCUMENTO VIGENTE
    </div>

    <div class="info-row">
        <div class="label">Alumno(a):</div>
        <div class="value">JOHANN RAMÍREZ PÉREZ</div>
    </div>

    <div class="info-row">
        <div class="label">Unidad académica:</div>
        <div class="value">ESCUELA SUPERIOR DE FÍSICA Y MATEMÁTICAS (ESFM)</div>
    </div>

    <div class="info-row">
        <div class="label">Programa académico:</div>
        <div class="value">LICENCIATURA EN FÍSICA Y MATEMÁTICAS</div>
    </div>

    <div class="info-row">
        <div class="label">Documento:</div>
        <div class="value">PASANTE NS. FÍSICO TEÓRICO Y MATEMÁTICO</div>
    </div>

    <div class="info-row">
        <div class="label">Código de verificación:</div>
        <div class="value">RAPJ05042024330156</div>
    </div>
</div>

</body>
</html>
